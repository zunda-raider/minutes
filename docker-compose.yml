services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: minutes_user
      POSTGRES_PASSWORD: minutes_pass
      POSTGRES_DB: minutes_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minutes_user -d minutes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
